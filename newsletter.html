<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter · Society of Capital Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--coal:#363b3e;--brass:#b5924e;--paper:#edf0f3;--ink:#24282c;--steel:#33608f;--rule:#c7cdd3;--dark:#1a1d20;--darkcard:#252a2e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;font-size:16px}
h1,h2,h3,.sec-label,.sec-title{font-family:'Space Grotesk','DM Sans',sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--brass);color:#fff;padding:8px 14px;z-index:9}
.skip:focus{left:8px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:0s !important}}
.topnav{position:sticky;top:0;z-index:100;background:rgba(26,29,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid rgba(181,146,78,.25);display:flex;align-items:center;padding:0 20px}
.topnav .logo{display:flex;align-items:center;gap:12px;padding:10px 0;text-decoration:none;flex-shrink:0}
.topnav .logo img{width:40px;height:40px;border-radius:50%;border:2px solid var(--brass)}
.topnav .logo span{font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.nav-links{display:flex;margin-left:auto;overflow-x:auto}
.nav-link{text-decoration:none;font-size:11.5px;letter-spacing:.1em;padding:14px 14px;white-space:nowrap;
 text-transform:uppercase;color:#aeb6c2;font-weight:600;transition:color .15s}
.nav-link:hover,.nav-link.active{color:var(--brass)}
.nav-link.active{box-shadow:inset 0 -2px 0 var(--brass)}
@media(max-width:700px){.topnav .logo span{display:none}.nav-link{padding:12px 10px;font-size:10.5px}}
.page-hero{background:var(--dark);color:#fff;padding:56px 28px 48px;position:relative;overflow:hidden}
.page-hero::before{content:"";position:absolute;inset:0;
 background-image:linear-gradient(rgba(181,146,78,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(181,146,78,.06) 1px,transparent 1px);
 background-size:48px 48px;animation:pgrid 50s linear infinite}
@keyframes pgrid{to{background-position:48px 48px}}
.page-hero-inner{position:relative;z-index:2;max-width:1200px;margin:0 auto}
.page-hero .eyebrow{font-family:'Space Grotesk';font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);font-weight:700}
.page-hero h1{font-size:clamp(30px,5.5vw,54px);font-weight:700;line-height:1.05;margin-top:12px;text-transform:uppercase}
.page-hero h1 em{font-style:normal;color:var(--brass)}
.page-hero .lede{font-size:16px;color:#aeb6c2;margin-top:14px;max-width:580px}
.sec{padding:52px 28px}
@media(min-width:800px){.sec{padding:64px 48px}.page-hero{padding:64px 48px 56px}}
.sec-inner{max-width:1200px;margin:0 auto}
.sec.dark{background:var(--dark);color:#fff}
.sec.light{background:var(--paper)}
.sec.cream{background:#f8f5ef}
.sec.white{background:#fff}
.sec-label{font-family:'Space Grotesk';font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:700}
.sec-title{font-size:clamp(24px,3.5vw,38px);font-weight:700;line-height:1.1;margin-top:8px;text-transform:uppercase}
.sec.dark .sec-label{color:var(--brass)}.sec.dark .sec-title,.sec.dark h3{color:#fff}.sec.dark p,.sec.dark .meta{color:#c0c6ce}
.meta{font-size:14px;color:#4a5261;margin-top:3px}
.ph{border:1.5px dashed var(--brass);background:rgba(181,146,78,.09);padding:0 6px;font-size:.82em;color:#6f5a2a}
.loading{opacity:.6;font-style:italic}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1)}
.reveal.visible{opacity:1;transform:none}
.footer{background:var(--dark);color:#aeb6c2;padding:24px 28px;text-align:center;font-size:12px;letter-spacing:.08em}
.footer strong{color:var(--brass)}
.btn{display:inline-block;padding:13px 26px;background:var(--brass);color:#1a1d20;font-weight:700;letter-spacing:.1em;font-size:13px;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:'Space Grotesk'}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(181,146,78,.3)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}


.issue-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:18px}
.issue-card{border:1.5px solid var(--ink);background:#fff;box-shadow:5px 5px 0 rgba(54,59,62,.14);
 text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.issue-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(181,146,78,.3)}
.issue-top{background:var(--coal);color:var(--paper);padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.issue-num{font-family:'Space Grotesk',monospace;font-size:26px;font-weight:800;color:var(--brass);line-height:1}
.issue-date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#aeb6c2;font-family:'Space Grotesk',monospace;text-align:right}
.issue-strip{height:4px;background:var(--brass)}
.issue-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.issue-title{font-weight:800;font-size:15px;line-height:1.35}
.issue-open{margin-top:auto;padding-top:12px;font-family:'Space Grotesk';font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brass)}
.issue-feature{grid-column:1/-1;flex-direction:row;align-items:stretch}
.issue-feature .issue-top{flex-direction:column;justify-content:center;min-width:130px;border-right:4px solid var(--brass)}
.issue-feature .issue-num{font-size:40px}
.issue-feature .issue-strip{display:none}
.issue-feature .issue-title{font-size:19px}
.issue-feature .issue-latest{font-family:'Space Grotesk';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:6px}
@media(max-width:560px){.issue-feature{flex-direction:column}.issue-feature .issue-top{border-right:none;border-bottom:4px solid var(--brass)}}

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<nav class="topnav" aria-label="Main navigation">
  <a class="logo" href="index.html">
    <img src="scd-logo.jpg" alt="SCD logo">
    <span>Society of Capital Design</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link" href="events.html">Events</a>
    <a class="nav-link" href="network.html">Network</a>
    <a class="nav-link active" href="newsletter.html">Newsletter</a>
    <a class="nav-link" href="join.html">Join</a>
  </div>
</nav>
<main id="main">
<section class="page-hero">
  <div class="page-hero-inner">
    <p class="eyebrow">The SCD Bulletin</p>
    <h1>News<em>letter</em></h1>
    <p class="lede" id="t-bulletin-intro">Every issue pairs a markets story with an engineering story and trains one specific thinking habit.</p>
  </div>
</section>

<section class="sec cream">
  <div class="sec-inner">
    <span class="sec-label reveal">Archive</span>
    <h2 class="sec-title reveal">All Issues</h2>
    <div id="issues-list" class="reveal"><p class="loading">Loading</p></div>
  </div>
</section>

<footer class="footer">
  <strong>Society of Capital Design</strong> · Founded 2025 · UAE
</footer>
</main>
<script>


const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ph = s => `<span class="ph">${esc(s)}</span>`;
const fmt = s => esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
let __content = null;
async function content(){
  if(__content) return __content;
  try{
    const r = await fetch("content.json?v=" + Date.now());
    __content = r.ok ? await r.json() : {};
  }catch(e){ __content = {}; }
  return __content;
}
async function rows(table){
  const c = await content();
  const a = Array.isArray(c[table]) ? c[table] : [];
  return a.slice().sort((x,y) => (parseInt(x.sort)||100) - (parseInt(y.sort)||100));
}
async function settings(){
  const c = await content();
  return c.settings || {};
}

async function applyText(map){
  const c = await content(); const t = c.text || {};
  for(const [id,key] of Object.entries(map)){
    const el = document.getElementById(id);
    if(el && t[key] && String(t[key]).trim()) el.innerHTML = fmt(t[key]);
  }
}
const S = (o,k,fallback) => (o && o[k] && String(o[k]).trim()) ? fmt(o[k]) : ph(fallback);


(async () => {
  const I = document.getElementById("issues");
  const iss = await rows("issues","sort");
  if(iss && iss.length){
    const num = t => { const m = String(t||"").match(/(\d+)/); return m ? m[1].padStart(2,"0") : "·"; };
    const strip = t => String(t||"").replace(/^Issue\s*\d+\s*[:.·-]?\s*/i,"");
    I.innerHTML = `<div class="issue-grid">` + iss.map((x,i) => {
      const inner = `
        <div class="issue-top">
          ${i===0 ? `<div><div class="issue-latest">Latest issue</div><div class="issue-num">${esc(num(x.title))}</div></div>` : `<div class="issue-num">${esc(num(x.title))}</div>`}
          <div class="issue-date">${fmt(x.date_text||"")}</div>
        </div>
        <div class="issue-strip"></div>
        <div class="issue-body">
          <div class="issue-title">${fmt(strip(x.title))}</div>
          <div class="issue-open">${x.link_url ? "Read the issue →" : "Coming soon"}</div>
        </div>`;
      return x.link_url
        ? `<a class="issue-card ${i===0?"issue-feature":""}" href="${esc(x.link_url)}" target="_blank">${inner}</a>`
        : `<div class="issue-card ${i===0?"issue-feature":""}">${inner}</div>`;
    }).join("") + `</div>`;
  } else {
    I.innerHTML = `<div class="rowlist"><div class="rowitem">
      <strong>${ph("[No issues published yet, Evidence Register, Bulletin row]")}</strong>
      <p class="meta">Issues are listed here as they are published, newest first.</p></div></div>`;
  }
})();
applyText({"t-news-intro":"newsletter_intro"});

</script>
<script>
(function(){
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("visible"); obs.unobserve(e.target); }});
  }, {threshold:0.08, rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll(".reveal,.sec-label,.sec-title,.page-hero h1,.page-hero .eyebrow,.page-hero .lede").forEach(el => {
    el.classList.add("reveal");
    obs.observe(el);
  });
})();
</script>
</body>
</html>
